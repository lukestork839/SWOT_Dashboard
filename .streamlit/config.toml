# Streamlit Configuration for Cloud Deployment
# Optimized for SWOT River Dynamics Dashboard

[server]
# Serve static files (banner image on welcome page)
enableStaticServing = true

# File upload size (for future data upload features)
maxUploadSize = 200

# Performance optimizations
enableCORS = false
enableXsrfProtection = true
enableWebsocketCompression = true

# Prevent timeouts during large operations
maxMessageSize = 200

[browser]
# Don't gather usage stats in production
gatherUsageStats = false

# Server address for browser auto-open URL (localhost works on all platforms)
serverAddress = "localhost"

[runner]
# Performance settings
magicEnabled = false  # Disable magic commands for slight performance boost
fastReruns = true  # Enable fast reruns
postScriptGC = true  # Run garbage collection after script execution

[client]
# Show detailed errors for debugging (can disable in production)
showErrorDetails = true
toolbarMode = "minimal"

[logger]
# Log level for production
level = "info"

# Performance monitoring
enableProfilingStats = false

[theme]
# Light theme for poster/figure exports
base = "light"
primaryColor = "#1f77b4"  # Matplotlib tab-blue accent (Uyak Creek uses dodgerblue #1E90FF)
font = "sans serif"
